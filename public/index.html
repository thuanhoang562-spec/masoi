<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ma Sói Online</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#12172b;--panel:#1b2240;--ink:#e8e4d4;--mute:#8a90ad;--wolf:#c23b4f;--moon:#e0b45a;--teal:#5fb3b0;--line:#2c3560;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 'Be Vietnam Pro',system-ui,sans-serif;transition:background .8s}
body.day{--bg:#2d3354}
.wrap{max-width:960px;margin:0 auto;padding:16px}
.hidden{display:none!important}
h1{font-size:2rem;font-weight:800;margin:.2em 0}
input,button{font:inherit;color:inherit}
input{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--moon);outline-offset:2px}
button.main{background:var(--wolf);border-color:var(--wolf);font-weight:600}
#home{max-width:380px;margin:10vh auto 0;display:grid;gap:12px}
#msg{color:var(--moon);min-height:1.5em;margin:0}
header{flex-wrap:wrap;display:flex;align-items:center;gap:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
#disc{width:42px;height:42px;border-radius:50%;box-shadow:inset -13px -4px 0 0 var(--moon);transition:all .8s}
body.day #disc{background:var(--moon);box-shadow:0 0 0 6px #e0b45a33}
header b{font-size:1.1rem}header span{color:var(--mute)}
#timer{margin-left:auto;font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
main{display:grid;gap:16px;margin-top:16px}
@media(min-width:760px){main{grid-template-columns:260px 1fr}}
#players{display:grid;gap:6px;align-content:start}
.p{display:flex;justify-content:space-between;text-align:left;width:100%}
.p small{color:var(--mute)}
.p:disabled{cursor:default;opacity:1}
.p.dead{opacity:.45;text-decoration:line-through}
.p.sel{border-color:var(--moon);box-shadow:0 0 0 2px var(--moon)}
.p:not(:disabled):hover{border-color:var(--moon)}
.r-wolf{color:var(--wolf)}.r-seer{color:var(--teal)}.r-witch{color:#b48be0}
#panel{background:var(--panel);border-radius:10px;padding:14px;display:grid;gap:8px;justify-items:start}
#panel p{margin:0}
#log{background:var(--panel);border-radius:10px;padding:12px;height:280px;overflow:auto;margin-top:12px}
#log p{margin:0 0 6px}
.s{color:var(--moon)}.w b{color:var(--wolf)}.d{color:var(--mute)}
#chat{display:flex;gap:8px;margin-top:8px}
header button{padding:6px 10px;font-size:.85rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;margin-top:10px}
.cardbox{text-align:center;font-size:.78rem;color:var(--mute);line-height:1.35}
details{width:100%}summary{cursor:pointer;color:var(--moon)}
.mycard{line-height:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <section id="home">
    <h1>Ma Sói</h1>
    <input id="name" placeholder="Tên của bạn" maxlength="14" autocomplete="off">
    <button class="main" id="create">Tạo ván mới</button>
    <input id="code" placeholder="Mã ván (4 chữ cái)" maxlength="4" autocapitalize="characters">
    <button id="join">Vào ván</button>
    <p id="msg"></p>
  </section>
  <section id="game" class="hidden">
    <header><div id="disc"></div><div><b id="ph"></b><br><span id="room"></span></div><div id="timer"></div><button id="mute" aria-label="Bật hoặc tắt âm thanh">🔊</button><button id="voice">🎙 Tham gia thoại</button><button id="mm" class="hidden">Mic: bật</button></header>
    <main>
      <aside id="players"></aside>
      <div>
        <div id="panel"></div>
        <div id="log"></div>
        <form id="chat"><input id="text" placeholder="Nhắn tin..." maxlength="160" autocomplete="off"><button>Gửi</button></form>
      </div>
    </main>
  </section>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ROLE = { wolf: 'Sói', villager: 'Dân làng', seer: 'Tiên tri', guard: 'Bảo vệ', witch: 'Phù thủy', hunter: 'Thợ săn', cupid: 'Cupid' };
const PH = { lobby: 'Sảnh chờ', night: 'Đêm', day: 'Thảo luận', vote: 'Bỏ phiếu', hunter: 'Thợ săn nổ súng', over: 'Kết thúc' };
const HINT = {
  wolf: 'Chọn một người để cả bầy cùng cắn. Bạn nhắn tin được với Sói khác.',
  seer: 'Chọn một người để soi xem có phải Sói không.',
  guard: 'Chọn một người để che chắn (không chọn cùng người hai đêm liền).',
  witch: 'Cứu nạn nhân bằng bình thuốc cứu, hoặc chọn một người để đầu độc. Mỗi bình dùng một lần.',
  hunter: 'Ngủ yên. Khi chết, bạn được bắn theo một người.',
  cupid: 'Đêm đầu: chọn hai người để ghép đôi. Một người chết, người kia chết theo.',
  villager: 'Bạn ngủ say. Đợi trời sáng.'
};

/* ---------- Thẻ vai trò (SVG) ---------- */
const CLR = { wolf: ['#3a0b16', '#c23b4f'], villager: ['#2e2616', '#c4a45e'], seer: ['#0b2c33', '#5fb3b0'], guard: ['#14264a', '#6c8fd6'], witch: ['#27123f', '#b48be0'], hunter: ['#14301a', '#6fae6a'], cupid: ['#451630', '#f08fb4'] };
const ART = {
  wolf: '<path d="M30 70 L38 28 L56 50 L64 50 L82 28 L90 70 L76 108 L60 118 L44 108Z" fill="C"/><circle cx="48" cy="72" r="5" fill="#12172b"/><circle cx="72" cy="72" r="5" fill="#12172b"/><path d="M52 96 L60 104 L68 96Z" fill="#12172b"/>',
  villager: '<path d="M26 80 L60 44 L94 80Z" fill="C"/><rect x="36" y="80" width="48" height="34" fill="C" opacity=".75"/><rect x="53" y="92" width="14" height="22" fill="#12172b"/>',
  seer: '<circle cx="60" cy="70" r="32" fill="none" stroke="C" stroke-width="5"/><path d="M34 70 Q60 44 86 70 Q60 96 34 70Z" fill="C" opacity=".35"/><circle cx="60" cy="70" r="9" fill="C"/><rect x="40" y="106" width="40" height="9" rx="3" fill="C"/>',
  guard: '<path d="M60 34 L90 46 V76 Q90 104 60 118 Q30 104 30 76 V46Z" fill="C"/><path d="M60 48 V106 M40 72 H80" stroke="#12172b" stroke-width="5"/>',
  witch: '<path d="M24 100 H96 L72 40 Q64 28 56 38Z" fill="C"/><rect x="38" y="86" width="44" height="8" fill="#12172b" opacity=".5"/><circle cx="86" cy="34" r="4" fill="#e0b45a"/><circle cx="34" cy="48" r="3" fill="#e0b45a"/>',
  hunter: '<circle cx="60" cy="72" r="30" fill="none" stroke="C" stroke-width="5"/><circle cx="60" cy="72" r="6" fill="C"/><path d="M60 28 V48 M60 96 V116 M16 72 H36 M84 72 H104" stroke="C" stroke-width="5"/>',
  cupid: '<path d="M60 108 L30 76 Q22 56 40 50 Q54 48 60 62 Q66 48 80 50 Q98 56 90 76Z" fill="C"/><path d="M22 114 L98 38 M98 38 L84 40 M98 38 L96 52" stroke="#e8e4d4" stroke-width="4" fill="none"/>'
};
const DESC = {
  wolf: 'Mỗi đêm cùng bầy chọn một người để cắn.', villager: 'Không có kỹ năng. Dùng lý lẽ để tìm Sói.',
  seer: 'Mỗi đêm soi một người xem có phải Sói không.', guard: 'Mỗi đêm che chắn một người, không lặp hai đêm liền.',
  witch: 'Một bình cứu, một bình độc, mỗi bình dùng một lần.', hunter: 'Khi chết được bắn theo một người.',
  cupid: 'Đêm đầu ghép đôi hai người. Một người chết, người kia chết theo.'
};
function card(r, big) {
  const [a, b] = CLR[r], w = big ? 150 : 100;
  return `<svg viewBox="0 0 120 170" width="${w}" role="img" aria-label="Thẻ ${ROLE[r]}"><defs><linearGradient id="g-${r}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${a}"/></linearGradient></defs><rect x="2" y="2" width="116" height="166" rx="12" fill="url(#g-${r})" stroke="${b}" stroke-width="2.5"/>${ART[r].replace(/"C"/g, `"${b}"`)}<text x="60" y="150" text-anchor="middle" font-size="15" font-weight="800" fill="#e8e4d4" font-family="Be Vietnam Pro,sans-serif">${ROLE[r]}</text></svg>`;
}
let guideOpen = false;

/* ---------- Âm thanh (tổng hợp bằng WebAudio, không cần file) ---------- */
let ac, mute = false;
const snd = (f, d, ty = 'sine', to = f, v = .15, t0 = 0) => {
  if (mute) return;
  try {
    ac = ac || new AudioContext(); ac.resume();
    const t = ac.currentTime + t0, o = ac.createOscillator(), g = ac.createGain();
    o.type = ty; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(to, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
};
const SFX = {
  night: () => { snd(300, 1.6, 'sawtooth', 640, .07); snd(640, 1.4, 'sawtooth', 360, .06, 1.5); },
  day: () => [784, 988, 1175, 1568].forEach((f, i) => snd(f, .7, 'triangle', f, .1, i * .16)),
  vote: () => { snd(90, .3, 'square', 45, .2); snd(90, .3, 'square', 45, .2, .45); },
  hunter: () => { snd(200, .25, 'sawtooth', 40, .25); },
  death: () => snd(110, 1.3, 'sine', 40, .3),
  tick: () => snd(880, .07, 'square', 880, .04),
  win: () => [523, 659, 784, 1047].forEach((f, i) => snd(f, .5, 'triangle', f, .12, i * .2)),
  pick: () => snd(520, .1, 'triangle', 700, .08)
};
$('mute').onclick = () => { mute = !mute; $('mute').textContent = mute ? '🔇' : '🔊'; applyMusic(); };

/* ---------- Nhạc nền: sảnh chờ êm dịu, ban đêm rùng rợn, ban ngày im lặng ---------- */
let mus = null, musMode = null;
const actx = () => (ac = ac || new AudioContext());
function stopMus() {
  if (!mus) return; const m = mus; mus = null; clearTimeout(m.t);
  m.g.gain.cancelScheduledValues(ac.currentTime); m.g.gain.setTargetAtTime(0, ac.currentTime, .35);
  setTimeout(() => m.nodes.forEach(n => { try { n.stop(); } catch (e) {} }), 1800);
}
function startMus(mode) {
  const c = actx(); c.resume();
  const g = c.createGain(), f = c.createBiquadFilter(), nodes = [], m = mus = { g, nodes, t: 0 };
  g.gain.value = 0; g.connect(c.destination); f.type = 'lowpass'; f.connect(g);
  const osc = (fr, ty, v) => { const o = c.createOscillator(), x = c.createGain(); o.type = ty; o.frequency.value = fr; x.gain.value = v; o.connect(x); x.connect(f); o.start(); nodes.push(o); };
  const lfo = (rate, depth, param) => { const o = c.createOscillator(), x = c.createGain(); o.frequency.value = rate; x.gain.value = depth; o.connect(x); x.connect(param); o.start(); nodes.push(o); };
  if (mode === 'night') {
    f.frequency.value = 420;
    osc(55, 'sawtooth', .5); osc(58.3, 'sawtooth', .5); osc(82.4, 'sine', .6); osc(116.5, 'sine', .25);
    g.gain.setTargetAtTime(.2, c.currentTime, 1.5); lfo(.13, .07, g.gain); lfo(.05, 120, f.frequency);
    const sting = () => {
      if (mus !== m) return;
      const k = Math.floor(Math.random() * 3);
      if (k === 0) { snd(1500, 3, 'sine', 650, .035); snd(1590, 3, 'sine', 700, .03); }
      else if (k === 1) { snd(62, .22, 'sine', 38, .35); snd(62, .22, 'sine', 38, .3, .3); }
      else { snd(90, 2.2, 'sawtooth', 45, .05); snd(95, 2.2, 'square', 48, .02); }
      m.t = setTimeout(sting, 5000 + Math.random() * 8000);
    };
    m.t = setTimeout(sting, 3000);
  } else {
    f.frequency.value = 1400;
    [220, 261.6, 329.6, 440].forEach((fr, i) => osc(fr, 'sine', .2 - i * .03));
    g.gain.setTargetAtTime(.07, c.currentTime, 2); lfo(.1, .02, g.gain);
  }
}
function applyMusic() {
  const mode = mute || !st ? null : st.ph === 'night' ? 'night' : st.ph === 'lobby' ? 'lobby' : null;
  if (mode === musMode) return;
  stopMus(); musMode = mode; if (mode) startMus(mode);
}
document.addEventListener('pointerdown', () => { if (ac && ac.state !== 'running') ac.resume(); });


/* ---------- Kết nối ---------- */
const s = io();
let st = null, end = 0, pick = [], lastKey = '', lastDead = 0, lastTick = 0, me = null, isHost = false;
const tok = localStorage.tok || (localStorage.tok = Math.random().toString(36).slice(2) + Date.now().toString(36));
const say = t => $('msg').textContent = t;
const nm = () => { const n = $('name').value.trim(); localStorage.name = n; return n; };
$('name').value = localStorage.name || '';
$('create').onclick = () => { const n = nm(); n ? s.emit('create', { name: n, token: tok }) : say('Hãy nhập tên.'); };
$('join').onclick = () => s.emit('join', { code: $('code').value.trim(), name: nm(), token: tok });
s.on('connect', () => { if (localStorage.room) s.emit('join', { code: localStorage.room, name: localStorage.name, token: tok }); });
s.on('err', m => { say(m); if (m.includes('phòng')) localStorage.removeItem('room'); });
const send = d => d.t === 'chat' ? s.emit('chat', d.x) : d.t === 'start' ? s.emit('start') : s.emit('act', d);
s.on('state', x => {
  const old = st; st = x; me = x.me; isHost = x.host; end = Date.now() + x.left; localStorage.room = x.code;
  $('home').classList.add('hidden'); $('game').classList.remove('hidden'); $('room').textContent = 'Mã ván: ' + x.code;
  const key = x.ph + x.day;
  if (key !== lastKey) { lastKey = key; pick = []; if (SFX[x.ph]) SFX[x.ph](); if (x.ph === 'over') SFX.win(); }
  const dead = x.P.filter(p => !p.a).length; if (old && dead > lastDead) SFX.death(); lastDead = dead;
  render(); syncVoice(); applyMusic();
});

/* ---------- Giao diện ---------- */
const meP = () => st && st.P.find(p => p.i === me);
const known = q => st.ph === 'over' || q.i === me || (meP() && meP().r === 'wolf' && q.r === 'wolf');
function can(q) {
  const m = meP(); if (!m || !q.a) return false;
  if (st.ph === 'night' && m.a) {
    if (m.r === 'wolf') return q.r !== 'wolf';
    if (m.r === 'seer') return q.i !== me;
    if (m.r === 'guard') return q.i !== st.lg;
    if (m.r === 'witch') return st.wi.p > 0;
    if (m.r === 'cupid') return st.day === 1;
  }
  if (st.ph === 'vote') return m.a && q.i !== me;
  if (st.ph === 'hunter') return !m.a && st.hp.includes(me);
  return false;
}
function render() {
  if (!st) { $('panel').innerHTML = '<p>Đang kết nối...</p>'; return; }
  const m = meP(), role = m && m.r;
  document.body.classList.toggle('day', st.ph === 'day' || st.ph === 'vote');
  $('ph').textContent = PH[st.ph] + (st.day ? ` · ngày ${st.day}` : '');
  $('players').innerHTML = st.P.map(q => `<button class="p ${q.a ? '' : 'dead'} ${pick.includes(q.i) ? 'sel' : ''}" data-i="${q.i}" ${can(q) ? '' : 'disabled'}>
    <span>${esc(q.n)}${q.i === me ? ' (bạn)' : ''}</span><small class="r-${known(q) ? q.r : ''}">${known(q) && q.r ? ROLE[q.r] : ''}</small></button>`).join('');
  let h = '';
  if (role) h += `<div class="mycard">${card(role, 1)}</div><p>Vai của bạn: <b class="r-${role}">${ROLE[role]}</b>${m.a ? '' : ' (đã chết, bạn vẫn xem được ván chơi)'}</p>`;
  if (st.ph === 'lobby') h += `<p>Đã có ${st.P.length} người. Cần 5 đến 12 người để bắt đầu.</p>`;
  if (st.ph === 'night' && m && m.a) {
    h += `<p>${HINT[role]}</p>`;
    if (role === 'witch') {
      const v = st.P.find(p => p.i === st.wv);
      h += `<p>Nạn nhân đêm nay: <b>${v ? esc(v.n) : 'chưa rõ'}</b>. Thuốc cứu: ${st.wi.h}, thuốc độc: ${st.wi.p}.</p>`;
      if (st.wi.h && v) h += '<button id="save">Cứu nạn nhân</button>';
      h += '<button id="skip">Không làm gì</button>';
    }
  }
  if (st.ph === 'day') h += '<p>Bàn bạc xem ai là Sói. Đây là lúc được dùng mic. Sắp tới sẽ bỏ phiếu.</p>';
  if (st.ph === 'vote' && m && m.a) h += '<p>Chọn người bạn muốn treo cổ.</p>';
  if (st.ph === 'hunter') h += st.hp.includes(me) ? '<p>Bạn là Thợ săn đã ngã xuống. Chọn người để bắn!</p>' : '<p>Thợ săn đang nhắm súng...</p>';
  if (st.ph === 'over') h += `<p><b>${st.win === 'wolf' ? 'Sói thắng' : 'Dân làng thắng'}</b></p>`;
  const mine = (st.seen || []); if (mine.length) h += `<p class="r-seer">${mine.map(esc).join('<br>')}</p>`;
  if (['lobby', 'over'].includes(st.ph)) h += isHost ? `<button class="main" id="start">${st.ph === 'over' ? 'Chơi ván mới' : 'Bắt đầu ván'}</button>` : '<p>Đợi chủ ván bắt đầu.</p>';
  h += `<details id="guide" ${guideOpen ? 'open' : ''}><summary>Xem tất cả thẻ vai trò</summary><div class="cards">${Object.keys(ROLE).map(r => `<div class="cardbox">${card(r)}<br>${DESC[r]}</div>`).join('')}</div></details>`;
  $('panel').innerHTML = h;
  if ($('start')) $('start').onclick = () => send({ t: 'start' });
  if ($('save')) $('save').onclick = () => send({ t: 'act', k: 'save' });
  if ($('skip')) $('skip').onclick = () => send({ t: 'act', k: 'skip' });
  const log = $('log'), bottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
  log.innerHTML = st.log.filter(e => e.c !== 'w' || (role === 'wolf') || st.ph === 'over').filter(e => e.c !== 'd' || (m && !m.a) || st.ph === 'over')
    .map(e => e.c === 's' ? `<p class="s">${esc(e.t)}</p>` : `<p class="${e.c}"><b>${e.c === 'w' ? '[Sói] ' : e.c === 'd' ? '[Người chết] ' : ''}${esc(e.f)}:</b> ${esc(e.t)}</p>`).join('');
  if (bottom) log.scrollTop = log.scrollHeight;
}
$('players').onclick = e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const i = b.dataset.i, r = meP().r; SFX.pick();
  pick = (st.ph === 'night' && r === 'cupid') ? [...pick, i].slice(-2) : [i]; render();
  send({ t: 'act', k: st.ph === 'night' && r === 'witch' ? 'poison' : 'pick', x: i });
};
$('chat').onsubmit = e => { e.preventDefault(); const t = $('text').value.trim(); if (t) send({ t: 'chat', x: t }); $('text').value = ''; };
setInterval(() => {
  const s = st && end && !['lobby', 'over'].includes(st.ph) ? Math.max(0, Math.ceil((end - Date.now()) / 1000)) : null;
  $('timer').textContent = s === null ? '' : s + 's';
  if (s !== null && s <= 5 && s > 0 && s !== lastTick) { lastTick = s; SFX.tick(); }
}, 300);


/* ---------- Thoại (WebRTC, signaling qua server) ---------- */
const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
const pcs = {}; let local = null, micOn = true;
$('panel').addEventListener('toggle', e => { if (e.target.id === 'guide') guideOpen = e.target.open; }, true);
// Mic chỉ mở ở sảnh chờ và khi trời sáng (pha thảo luận). Người đã chết không được nói.
function allow(q) {
  if (!q || !st) return false;
  if (st.ph === 'lobby') return true;
  return st.ph === 'day' && !!q.a;
}
function canSpeak() { const m = meP(); return !!m && (st.ph === 'lobby' || (st.ph === 'day' && !!m.a)); }
function applyMic() {
  if (!local) return;
  const ok = canSpeak();
  local.getTracks().forEach(t => t.enabled = micOn && ok);
  $('mm').textContent = !ok ? 'Mic: khóa' : micOn ? 'Mic: bật' : 'Mic: tắt';
}
function drop(id) { const x = pcs[id]; if (!x) return; try { x.pc.close(); } catch (e) {} if (x.au) { x.au.pause(); x.au.srcObject = null; } delete pcs[id]; }
function peer(id) {
  if (pcs[id]) return pcs[id];
  const pc = new RTCPeerConnection(ICE), x = pcs[id] = { pc, au: null, q: Promise.resolve() };
  local.getTracks().forEach(t => pc.addTrack(t, local));
  pc.onicecandidate = e => e.candidate && s.emit('sig', { to: id, data: { c: e.candidate } });
  pc.ontrack = e => { if (!x.au) { x.au = new Audio(); x.au.autoplay = true; } x.au.srcObject = e.streams[0]; filterAudio(); };
  pc.onconnectionstatechange = () => { if (['failed', 'closed'].includes(pc.connectionState)) drop(id); };
  return x;
}
function filterAudio() { Object.keys(pcs).forEach(id => { const x = pcs[id]; if (x.au) x.au.muted = !allow(st.P.find(p => p.i === id)); }); }
async function call(id) { const { pc } = peer(id); const o = await pc.createOffer(); await pc.setLocalDescription(o); s.emit('sig', { to: id, data: { d: pc.localDescription } }); }
function syncVoice() {
  if (!st) return;
  if (local) {
    st.P.forEach(q => { if (q.i !== me && q.v && !pcs[q.i] && me < q.i) call(q.i); });
    Object.keys(pcs).forEach(id => { const q = st.P.find(p => p.i === id); if (!q || !q.v) drop(id); });
  }
  filterAudio(); applyMic();
}
s.on('sig', ({ from, data }) => {
  if (!local) return;
  const x = peer(from);
  x.q = x.q.then(async () => {
    if (data.d) {
      await x.pc.setRemoteDescription(data.d);
      if (data.d.type === 'offer') { const a = await x.pc.createAnswer(); await x.pc.setLocalDescription(a); s.emit('sig', { to: from, data: { d: x.pc.localDescription } }); }
    } else if (data.c) { try { await x.pc.addIceCandidate(data.c); } catch (e) {} }
  }).catch(() => {});
});
function leaveVoice() {
  local.getTracks().forEach(t => t.stop()); local = null; Object.keys(pcs).forEach(drop); s.emit('voice', false);
  $('voice').textContent = '🎙 Tham gia thoại'; $('mm').classList.add('hidden');
}
$('voice').onclick = async () => {
  if (local) return leaveVoice();
  try { local = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch (e) { return alert('Không mở được micro. Hãy cho phép quyền micro cho trang này (cần kết nối https).'); }
  micOn = true; $('mm').classList.remove('hidden'); $('voice').textContent = '🎙 Rời thoại';
  s.emit('voice', true); syncVoice(); applyMic();
};
$('mm').onclick = () => { micOn = !micOn; applyMic(); };
</script>
